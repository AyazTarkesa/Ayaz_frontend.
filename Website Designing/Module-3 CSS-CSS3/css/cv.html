<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            height: 100vh;

            background: linear-gradient(to right, orange, red);

        }

        .navbar {
            width: 50%;
            height: auto;
            margin: auto;
            margin-top: 3%;
            border: none;
            box-shadow: 2px 5px 10px;
            background-color:none;
            backdrop-filter: blur(10px);
            padding: 3px;
            border-radius: 12px;
            justify-content: center;
            position: relative;
            align-items: center;
            justify-content: center;
        }

        .navbar:hover {
            box-shadow: 1px 2px 20px white;
        }

        ul {
            position: relative;
            display: flex;
            gap: 20px;
            text-decoration: none;
            list-style-type: none;
         }

         .navbar a
         {
            position: relative;
            display: inline-block;
            text-decoration: none;
            list-style-type: none;
            color: white;
            font-size: 1.3em;
            justify-content: center;
            margin-left: 40%;
            align-items: center;
            padding: 2px 23px;
            z-index: -1;
         }
         li 
         {
            text-transform: capitalize;
            text-decoration: none;
            
           

        }
        .navbar span
        {
            position: absolute;
            top: 0;
            left: 75px;
            width: 100px;
            height: 100%;
            background-color:crimson;
            border-radius: 12px;
            z-index: -100;
            transition: .5s;
        }
        li:nth-child(1):hover ~ span {
    left: 75px;
}

li:nth-child(2):hover ~ span {
    left: 200px;
}

li:nth-child(3):hover ~ span {
    left: 320px;
}

li:nth-child(4):hover ~ span {
    left: 450px;
}
.main
{
    display: flex;
}
.app
{
    width: 50%;
    height: auto;
    padding: 8px;
    margin-top: 5%;
    font-size: 5vh;
    margin-left: 5%;
    
}
h1
{
    color: white;
}
span
{
    color:red;
}
p
{
    margin: 0;
    color: white;
    margin-top: -4%;
    font-size: 20px;
    
}
#openModal
{
    width: 20%;
    height: 50px;
    margin-top: 3%;
    background-color:#f71616;
    font-size: 20px;
    color: white;
    border: 1px solid black;
    border-radius: 8px;
}
        
img
{
    margin-top: 50%;
    border-radius: 1300px;
}
#MyModal
{
    width: 30%;
    height: 410px;
    margin-top: 8%;
    background: linear-gradient(to right, red, black);  
    box-shadow: -1px 6px 7px ; 
    color: black;
    border:  none;
    padding: 0;
        overflow: hidden;

    border-radius: 10px;
     opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
}
@starting-style {
    #MyModal:modal {
        opacity: 0;
        transform: scale(0.7);
    }
}
#MyModal h1 
{
    color:white;
    margin: 0;
    margin-left: 40%;
    margin-top: 3%;
}
.form
{
    width: 70%;
    height: 300px;

    margin: 0;
    margin-top: 10%;
    margin-left: 20%;
    padding:0;
}
.info
{
    width: 500px;
    height: 100px;
    padding: 12px;
    margin-top: 20%;
    margin-left: -20%;
}
#name
{
    width: 220px;
    margin: 10px;
    padding: 12px;
    outline:none;
    margin-left: 8%;
    border: none;
    border-radius: 8px;

}
#password
{
    width: 220px;
    margin: 12px;
    margin-left:2%;
    padding: 12px;
        outline: none;

     border: none;
    border-radius: 8px;
}

#fname
{
    font-size: 20px;
    font-weight: bold;
    color: white;
}
#pass
{
    color: white;
    font-size: 20px;
    font-weight: bold;
}
.sbtn
{
    width: 100%;
    height: 100px;
    margin-top: 20%;
    margin-left: 20%;
}
.fbtn
{
    width: 120px;
    height: 40px;
    background-color: #f71616;
    color: white;
    border: none;
    border-radius: 8px;
}
::placeholder
{
    font-weight: bold;
}

        
    </style>
</head>

<body>
    <div class="navbar">
        <nav>
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">service</a></li>
                <li> <a href="#">About</a></li>
                <li> <a href="#">Contact</a> </li>
                <span></span>
            </ul>
        </nav>
    </div>

    <div class="main">
    <div class="app">
        <h1><span>website</span> <br>devlopment</h1>
        <p>join and grow your career</p>
        <button id="openModal" >Sign up</button>
    </div>
    <div class="img">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUOcnmc5NRag1Ng8hyFRpiuuy2D7ssDKyZ905jO1owgg&s=10">
    </div>
    </div>

    <dialog id="MyModal">
        <form>
            <h1> Login</h1>
            <div class="form">
                <div class="info">
                    <label for="name" id="fname">Name</label>
                        <input type="text" id="name" placeholder="*Enter your name" required><br>
                        <label for="password" id="pass">password</label>
                        <input type="password" id="password" placeholder="*Enter your password" required><br>

                            
                </div>

            <div class="sbtn">
                <input type="submit" class="fbtn" value="Submit">
            </div>
            </div>
        </form>
    </dialog>
    <script>
        const modal = document.getElementById("MyModal");
        const openModal = document.getElementById("openModal")

        openModal .addEventListener('click',() => {
            modal.showModal();

        });
    </script>
</body>

</html>

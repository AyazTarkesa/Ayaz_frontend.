<style>
    body
    {
        padding: 0;
        margin: 0;
        background-color:#0e231c;
    }
    header
    {
        width: 100%;
        height: auto;
        margin: 8px;
        margin-left: 4%;
        padding: 5px;
        color: white;
        display:flex;
        flex-wrap: nowrap;
        animation: 2s backInDown alternate;
        
    }
    nav
    {
        width: 30%;
        height: auto;
        margin-left: 30%;
        padding: 4px;
        color: white;
        gap: 40px;
        text-transform: capitalize;
        display:flex;
        flex-wrap: nowrap;         
        
      
    }
    button
    {
        width: 10%;
        height: 30px;
        margin: auto;
        padding: 2px;
        background-color: #0e231c;
        color: white;
        border:soild 0px black;
        margin-left: 1%;

    button:active
    {
          transform: translateY(2px);

    }
    nav h3:hover
    {
        font-size: 20px;
        padding: 5px;
        border: solid 1px white;
        border-radius: 7px;
        background-color: brown;
        transition: ease 0.5s all;
    }
    button:active::after
    {
        background-color: #90EE90;
    }
    nav
    {
          transform: translateY(2px);
    }
    
    .main
    {
        width: 100%;
        height: auto;

        flex-wrap: nowrap;
        padding: 12px;
        gap: 20px;
        
    }
    section
    {
        width: 50%;
        height: auto;
        margin-left: 4%
    }
    section h1
    {
        width: 60%;
        height: auto;
        color: white;
        font-size: 80px;
    }
    button:hover
    {
        background-color: white;
        color: black;
        border-radius:10px ;
        transition: 0.5s;
    }
    section h1
    {
      animation:backInLeft 2s alternate;
    }

    section img
    {
             
              animation:backInRight 2s alternate;
              box-shadow: 10px 10px 5px lightslategray;

    }
    section img:hover
    {
        transform: rotate3d(0, 1, 0.5, 3.142rad);
        border-radius: 50px;
        transition: 2s;
    }
    .detail
    {
        width: 40%;
        height: 200px;
        margin: 7px;
        padding: 12px;
        margin-left: 4%;
        margin-top: -4%;
        font-size: 20px;

        border-radius: 7px;
        animation: 2s backInUp alternate;
        display: flex;
        flex-wrap: wrap;
    }
    span
    {
        color: red;
    }
    .m {
    width: 90%;
    height: 300px;
    background-color:#0e231c;
    display: flex;
    flex-wrap: nowrap;
    margin-top: 7%;
}

.content {
    width: 300px;
    height: 200px;
     background-color:rgb(107, 143, 50);
     border-radius: 10px;
    padding: 5px;
    margin: 9px;
}
#icon
{
    box-shadow: none;
    margin-left: 30%;
    transform: none;
    animation: none;
}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            padding: 0;
            margin: 0;
            background-image: url("https://png.pngtree.com/thumb_back/fh260/background/20240808/pngtree-river-between-mountains-autumn-forest-travel-fresh-air-image_16125524.jpg");
            background-size: cover;
            background-repeat: no-repeat;
        
        }

        .app {
            width: 30%;
            height: 60vh;
            margin-top:12%;
            margin-left: 35%;
            border: 2;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-wrap: wrap;
            
            


        }
        .form1
        {
            width: 100%;
            height: auto;
            margin-top: 12%;
            margin-left: 30%;
            color: white;
            
            
        
        }
        .btn
        {
            width: 100%;
            height: auto;
            margin-top: 12%;
        
        
        }
        button
        {
            width: 30%;
            height: 30px;
            background-color:darkblue;
            color:gray;
            border: solid black 0.4px;
            border-radius: 1px;
        }
        input
        {
            width: 70%;
            height: 30px;
            padding: 5px;
            border: solid white 1px;
            border-radius: 10px;
            background: none;
            color: white;
            text-transform: capitalize;
            size: 12px;
        }
        ::placeholder
        {
            color: white;
        }
        

    </style>
</head>

<body>

    <div class="app">
        <div class="form1">
             
                <h1> Login </h1>
                <p> Name </p>
                <input type="text" placeholder="enter your name"><br>
                <p>Email</p>
                 <input type="email" placeholder="enter your Email"><br>

                <div class="btn">
                    <button type="submit">Login</button>
                </div>

        </div>
    </div>

</body>
</html>

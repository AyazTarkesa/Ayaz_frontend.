<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        .card
        {
            width: 30%;
            height: 200px;
            margin: auto;
            margin-top: 10%;
            background-color: blue;
            border: none;
             border-radius: 14px;
             justify-content: center;
             align-items: center;
        }
        .main
        {
            width: 80%;
            height: 190px;
            text-align: center;
            margin: auto;
            margin-top: 20%;
        }
        .head
        {
            width: 100%;
            height: 20px;
            margin: 0;
            margin-top: 2%;
            text-align: center;
        }
        .head h2
        {
            width: 100%;
            height: auto;
            color: white;
        }
        .display    
        {
            width: 100%;
            height: 25px;
            margin-top: 12%;
            text-align: center;
        }
        .display input
        {
            width: 60%;
            height: 40px;
            font-size: 20px;
        }
        .btn
        {
            width: 100%;
            height: 50px;
            margin-top: 10%;
        }
        .dp
        {
            width: 30%;
            height: 30px;
            border: none;
            border-radius: 5px;
            background-color: red;
        }
        .wd
        {
            width: 30%;
            height: 30px;
            border: none;
            border-radius: 5px;
            background-color: yellow;
        }
    </style>
</head>
<body>


    <div class="card">
        <div class="main">
        <div class="head">
            <h2> ATM </h2>
            </div>
            <div class="display">
                <input type="number">
            </div>
            <br>
            <div class="btn">
                <button type="button" class="dp">Deposite</button>
                <button type="button" class="wd">Withdraw</button>
            </div>
    </div>
    </div>
    
</body>
</html>

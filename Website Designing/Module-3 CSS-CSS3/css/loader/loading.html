<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
    <style>
        .main
        {

            width: 100%;
            height: 500px;
            display: flex;
            position: relative;
            justify-content: center;
            align-items: center;
        }
        .loader
        {
            width: 150px;
            height: 150px;
            border-radius: 90px;
            border: 10px solid black;
            border-top: 10px solid blue;
            position:absolute;
            justify-content: center;
            animation: rotateOut 1s ease infinite;
            animation-delay: 0ms;
        
        }
      @keyframes  rotateOut{
 0% {
    transform: rotate(0deg);   /* Starting position */
  }
  
  100% {
    transform: rotate(360deg);   /* Starting position */
  }
}
        h1
        {
            margin-top: 30%;
        }
    </style>
</head>
<body>
    <div class="main">
    <div class="loader"></div>
        <h1> loader..</h1>

</div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     

        .card
        {
            width: 30%;
            height: 430px;
            margin:auto;
            margin-top: 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #e0e5ec;
            border: none;
            box-shadow: 5px 5px 7px black, -9px -9px 18px #ffff ;
            border-radius: 18px;
           
        }
        .fom
        {
            width: 100%;
            height: 350px;
            margin-top: -10%;
            margin-left: 40%;
            
        }
        .info
        {
            width: 100%;
            height: 400px;
            margin-top: 12%;
            font-weight: bold;
        }
       
        .info input
        {
        border: none;
        border-radius: 12px;
        background:#e0e5ec ;
         box-shadow:inset 6px 6px 12px #a3b1a3,inset -6px -6px 12px #ffff;
         padding: 12px;   
          margin: 5px 5px 15px 15px ;
        }
        .header
        {
            width: 50%;
            height: 20px;
            text-align: center;
            font-size: 20px;
            text-transform: capitalize;
            font-weight: bold;
        }
       
        .btn
        {
            width: 30%;
            height: 40px;
            text-align: center;
            margin-top: 5%;
        }
        .button
        {
            width: 100%;
            height: 30px;
            background-color: #e0e5ec;
            border: none;
            border-radius: 12px;
            box-shadow: 5px 5px 7px black, -9px -9px 18px #ffff ;
            font-size: 15px;
            font:bold 2px;
        }
        input:focus
        {
            outline: none;
            box-shadow:inset 4px 4px 4px  #a3b1c6,inset -6px -6px 15px #ffff,0 0 0 2px #7c8cff;
            
        }

    </style>
</head>
<body bgcolor="#e0e5ec">
    <div class="card">
        <div class="fom">
            <form>
            <div class="header">
            <h2> Login Page</h2>
        </div>
        <div class="info">
            <label> Name </label><br>
            <input type="text" placeholder="*Enter Your Name" class="name" required><br>
            <label>Email </label><br>
            <input type="email" placeholder="*Enter Your email" required><br>
            <label> Password </label><br>
            <input type="password" placeholder="*Enter Your Name" required><br>

            <div class="btn">
                <button type="button" class="button">Submit</button>
            </div>

        </div>

            </form>
        </div>
    </div>
</body>
</html>

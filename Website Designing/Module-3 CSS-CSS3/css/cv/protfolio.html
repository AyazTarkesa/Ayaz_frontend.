<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            height: 100vh;

            background: linear-gradient(to right, orange, red);

        }

        .navbar {
            width: 50%;
            height: auto;
            margin: auto;
            margin-top: 3%;
            border: 1px solid orange;
            background-color: none;
            backdrop-filter: blur(500px);
            padding: 3px;
            border-radius: 12px;
        }

        .navbar:hover {
            box-shadow: 1px 2px 20px white;
        }

        ul {

            display: flex;
            gap: 20px;
            margin-left: 20%;



        }

        li {
            text-transform: capitalize;
            text-decoration: none;
            list-style-type: none;


        }

        li:hover {

            background-color: #f05b11;
            border: 1px solid orange;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <nav>
            <ul>
                <li>home</li>
                <li> service</li>
                <li> about</li>
                <li> contact </li>
            </ul>
        </nav>
    </div>
</body>

</html>

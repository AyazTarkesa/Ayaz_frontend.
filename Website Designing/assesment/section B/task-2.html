<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header, footer {
            padding: 10px;
            background-color: hsl(0, 69%, 53%);
            color: white;
        }
        h1
        {
            margin-left: 5%;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input{
            margin-bottom: 10px;
            height: 30px;
            width: auto;
            border-radius: 5px;
        }
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }
        textarea
        {
            border-radius: 6px;
        }
        button{
            margin-top: 10px;
            padding: 10px 20px;
            background-color: lab(48.58% 1.74 -47.62);
            color: hwb(0 92% 5%);
            
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover
        {
            background-color: gray;
            color: #080808;
        }
       

        div{
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        
    </style>
</head>
<body>

    <header>
        <h1>Food Order Booking</h1>
    </header>

    <main>
        <form>
            
            <div>
                <label for="customerName"><b>Customer Name:</b></label><br>
                <input type="text" class="customerName" name="customerName" required>
            
            <br>
            
                <label for="deliveryAddress"><b>Delivery Address:</b></label><br>
                <textarea id="deliveryAddress" name="deliveryAddress" rows="4" cols="30" required></textarea>
            
            <br>
            
                <label for="deliveryTime"><b>Delivery Time Slot:</b></label><br>
                <select id="deliveryTime" name="deliveryTime">
                    <option value="" disabled selected>Select a time</option>
                    <option value="lunch">12:00 PM - 1:00 PM</option>
                    <option value="afternoon">1:00 PM - 2:00 PM</option>
                    <option value="dinner">7:00 PM - 8:00 PM</option>
                </select>
            
            <br>

                <button type="submit"><b>Submit Order</b></button>
                <button type="reset"><b>Reset Form</b></button>
            </div>

        </form>
    </main>

    <footer>
        <p>  All rights reserved.</p>
    </footer>

</body>
</html>
